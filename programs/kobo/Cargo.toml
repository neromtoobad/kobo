[package]
name = "kobo"
version = "0.1.0"
description = "Kobo: an on-chain allowance that lets an AI agent pay per call over x402, inside limits its owner sets."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kobo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
